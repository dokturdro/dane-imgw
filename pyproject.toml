[project]
name = "daneimgw"
version = "0.1.0"
description = "Local mirror + cleaning pipeline for IMGW public meteorological data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "pymetdecoder>=0.2.2",
    "streamlit>=1.40",
    "typer>=0.12",
]

[project.scripts]
imgw = "imgw.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imgw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pymetdecoder notes on cloud-group consistency etc.; not failures
filterwarnings = ["ignore::Warning:pymetdecoder.*"]
